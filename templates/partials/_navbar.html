{# ── 共用导航栏 ──
   参数：
     active ∈ {None, 'home', 'game', 'room', 'rankings'}  当前激活的导航项
#}
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">
            <i class="bi bi-grid-3x3-gap-fill"></i>棋域对战
        </a>
        <button class="navbar-toggler border-0" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link{% if active == 'home' %} active{% endif %}" href="/" data-page="home">
                        <i class="bi bi-house"></i> 首页
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{% if active == 'rankings' %} active{% endif %}"
                       href="/rankings">
                        <i class="bi bi-trophy"></i> 排行榜
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{% if active == 'history' %} active{% endif %}"
                       href="/history">
                        <i class="bi bi-clock-history"></i> 历史对局
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>
